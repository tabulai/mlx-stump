name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    # macos-14/15 GitHub-hosted runners are Apple Silicon; MLX runs there
    # (Metal in the runner VM when available, CPU fallback otherwise — the
    # suite passes either way, gpu-marked tests are advisory)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
        python-version: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests bench .github/scripts
      - run: python -m pytest tests/ -q

  build:
    name: Build distributions
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Test the built wheel in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install dist/*.whl "pytest>=8" "stumpy>=1.13"
          "${RUNNER_TEMP}/wheel-venv/bin/python" - <<'PY'
          import pathlib, mlx_stump
          assert "site-packages" in pathlib.Path(mlx_stump.__file__).as_posix(), mlx_stump.__file__
          PY
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pytest tests/ -q
      - name: Build and test from the sdist in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          sdist_file="$(find "${GITHUB_WORKSPACE}/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "${sdist_file}"
          mkdir -p "${RUNNER_TEMP}/sdist"
          tar xzf "${sdist_file}" -C "${RUNNER_TEMP}/sdist"
          python -m venv "${RUNNER_TEMP}/sdist-venv"
          "${RUNNER_TEMP}/sdist-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/sdist-venv/bin/python" -m pip install --no-cache-dir \
            "${sdist_file}" "pytest>=8" "stumpy>=1.13"
          cd "${RUNNER_TEMP}"/sdist/mlx_stump-*
          "${RUNNER_TEMP}/sdist-venv/bin/python" - <<'PY'
          import pathlib
          import sys

          import mlx_stump

          module = pathlib.Path(mlx_stump.__file__).resolve()
          prefix = pathlib.Path(sys.prefix).resolve()
          assert module.is_relative_to(prefix), (module, prefix)
          assert "site-packages" in module.as_posix(), module
          print("testing sdist installation", module, mlx_stump.__version__)
          PY
          "${RUNNER_TEMP}/sdist-venv/bin/python" -m pytest tests -q -p no:cacheprovider
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
