name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macos-14/15 GitHub-hosted runners are Apple Silicon; MLX runs there
    # (Metal in the runner VM when available, CPU fallback otherwise — the
    # suite passes either way, gpu-marked tests are advisory)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
        python-version: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests bench
      - run: python -m pytest tests/ -q

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
