name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macos-14/15 GitHub-hosted runners are Apple Silicon; MLX runs there
    # (Metal in the runner VM when available, CPU fallback otherwise — the
    # suite passes either way, gpu-marked tests are advisory)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
        python-version: ["3.10", "3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests bench .github/scripts
      - run: python -m pytest tests/ -q

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Test the built wheel in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install dist/*.whl "pytest>=8" "stumpy>=1.13"
          "${RUNNER_TEMP}/wheel-venv/bin/python" - <<'PY'
          import pathlib, mlx_stump
          assert "site-packages" in pathlib.Path(mlx_stump.__file__).as_posix(), mlx_stump.__file__
          PY
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pytest tests/ -q
      - name: Check that the sdist's bundled tests are self-contained
        run: |
          mkdir -p "${RUNNER_TEMP}/sdist"
          tar xzf dist/*.tar.gz -C "${RUNNER_TEMP}/sdist"
          cd "${RUNNER_TEMP}"/sdist/mlx_stump-*
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pytest tests -q -p no:cacheprovider
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
