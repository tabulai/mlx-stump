name: Release

# Publishes to PyPI on a pushed version tag (v0.1.0, v0.2.0, ...).
# Requires a PyPI "trusted publisher" configured for this repository
# (project: mlx-stump, workflow: release.yml, environment: pypi) — no API
# token is stored in the repo.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" build twine
      - run: ruff check src tests bench
      - run: python -m pytest tests/ -q
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
