name: Release

# Publishes to PyPI. Run it by hand from the `main` branch:
#
#   gh workflow run release.yml --ref main -f version=0.1.0
#
# after bumping `__version__` in src/mlx_stump/__init__.py to that version,
# committing on main and letting CI pass. The build job refuses to run on
# any other branch, refuses a version that does not equal `__version__`
# (or a non-canonical PEP 440 / .dev / local one), and tests the wheel it
# is about to upload in a clean environment; the publish job uploads and
# only then creates the `v<version>` tag itself. Pushing a `v*` tag by hand
# publishes nothing: a tag on an old commit would otherwise run that
# commit's own copy of this workflow, with or without its guards.
#
# Requires a PyPI "trusted publisher" configured for this repository
# (project: mlx-stump, workflow: release.yml, environment: pypi) — no API
# token is stored in the repo. Recommended repository settings on top:
# required reviewers on the `pypi` environment, and a ruleset restricting
# who may create `v*` tags.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release; must equal __version__ (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Refuse to release from anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "release refused: run this workflow from main (got ${GITHUB_REF})" >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the requested version is the package version
        run: python .github/scripts/check_tag_version.py "v${VERSION}"
      - run: python -m pip install build twine "ruff>=0.5"
      - run: ruff check src tests bench .github/scripts
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Test the built wheel in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install dist/*.whl "pytest>=8" "stumpy>=1.13"
          # the suite must import the installed wheel, never the source tree
          "${RUNNER_TEMP}/wheel-venv/bin/python" - <<'PY'
          import pathlib, mlx_stump
          assert "site-packages" in pathlib.Path(mlx_stump.__file__).as_posix(), mlx_stump.__file__
          print("testing", mlx_stump.__file__, mlx_stump.__version__)
          PY
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pytest tests/ -q
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
      contents: write  # the release tag
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse an already-released version
        run: |
          git fetch --tags --quiet origin
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "release refused: tag v${VERSION} already exists" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Tag the released commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "mlx-stump ${VERSION}"
          git push origin "v${VERSION}"
