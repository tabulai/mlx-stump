name: Publish to PyPI

# This filename and environment deliberately differ from every historical
# publisher in this repository. Before the first run, configure PyPI's trusted
# publisher as:
#
#   project: mlx-stump
#   workflow: publish-pypi.yml
#   environment: pypi-release-v2
#
# Revoke the historical release.yml / pypi identity as well. Otherwise a tag
# aimed at an old commit could still run that commit's workflow and obtain an
# OIDC publishing token. Protect pypi-release-v2 with required reviewers and
# restrict v* tag creation with a repository ruleset.
#
# Run this workflow manually from main after updating __version__, committing,
# and letting CI pass:
#
#   gh workflow run publish-pypi.yml --ref main -f version=0.1.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release; must equal __version__ (e.g. 0.1.0)"
        required: true
        type: string

# Serialize the tag-and-publish transaction. Never cancel a release after its
# tag may have been created.
concurrency:
  group: mlx-stump-pypi-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Refuse to release from anything but main
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "release refused: run this workflow from main (got ${GITHUB_REF})" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Check that the requested version is the package version
        run: python .github/scripts/check_tag_version.py "v${VERSION}"
      - run: python -m pip install build twine "ruff>=0.5"
      - run: ruff check src tests bench .github/scripts
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Test the built wheel in a clean environment
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install --upgrade pip
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install \
            dist/*.whl "pytest>=8" "stumpy>=1.13"
          "${RUNNER_TEMP}/wheel-venv/bin/python" - <<'PY'
          import pathlib
          import sys

          import mlx_stump

          module = pathlib.Path(mlx_stump.__file__).resolve()
          prefix = pathlib.Path(sys.prefix).resolve()
          assert module.is_relative_to(prefix), (module, prefix)
          assert "site-packages" in module.as_posix(), module
          print("testing", module, mlx_stump.__version__)
          PY
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pytest tests/ -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
          # A release recovery uses GitHub's "Re-run all jobs" on this same
          # workflow run, so replace the previous immutable v4 artifact.
          overwrite: true

  prepare_publish:
    name: Verify PyPI state
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      VERSION: ${{ inputs.version }}
    outputs:
      publish_needed: ${{ steps.pypi_state.outputs.publish_needed }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist/
      - name: Check for an exact partial or completed PyPI upload
        id: pypi_state
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import urllib.error
          import urllib.request

          dist = pathlib.Path("dist")
          files = sorted(path for path in dist.iterdir() if path.is_file())
          if not files:
              raise SystemExit("release refused: downloaded artifact contains no distributions")
          local = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in files
          }

          version = os.environ["VERSION"]
          request = urllib.request.Request(
              f"https://pypi.org/pypi/mlx-stump/{version}/json",
              headers={"Accept": "application/json", "Cache-Control": "no-cache"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              remote = {}
          else:
              remote = {
                  item["filename"]: item.get("digests", {}).get("sha256")
                  for item in payload.get("urls", [])
              }
              if not remote:
                  raise SystemExit(
                      f"release refused: PyPI has version {version} but reports no files"
                  )

          extra = sorted(remote.keys() - local.keys())
          mismatched = sorted(
              name for name in remote.keys() & local.keys() if remote[name] != local[name]
          )
          if extra or mismatched:
              raise SystemExit(
                  "release refused: PyPI already contains different artifacts for "
                  f"{version} (unexpected={extra}, hash_mismatch={mismatched})"
              )

          pending = pathlib.Path("dist-pending")
          pending.mkdir()
          for name in sorted(local.keys() - remote.keys()):
              shutil.copy2(dist / name, pending / name)

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              if remote.keys() == local.keys():
                  print("publish_needed=false", file=stream)
                  print("all distributions already exist on PyPI with matching hashes")
              else:
                  print("publish_needed=true", file=stream)
                  if remote:
                      print(
                          "resuming an exact partial upload; existing files: "
                          + ", ".join(sorted(remote))
                      )
          PY
      - if: steps.pypi_state.outputs.publish_needed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-dist
          path: dist-pending/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  tag:
    name: Tag the verified commit
    needs: prepare_publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # This is the only job allowed to mutate repository contents. Checkout does
    # not persist credentials; the tag step uses its short-lived token directly.
    permissions:
      contents: write  # create the verified annotated release tag
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Create or verify the release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git fetch --force --tags --quiet origin \
            "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "refs/remotes/origin/main"; then
            echo "release refused: ${GITHUB_SHA} is no longer on origin/main" >&2
            exit 1
          fi

          verify_existing_tag() {
            if [[ "$(git cat-file -t "refs/tags/${tag}")" != "tag" ]]; then
              echo "release refused: ${tag} exists but is not an annotated tag" >&2
              return 1
            fi
            local target
            target="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if [[ "${target}" != "${GITHUB_SHA}" ]]; then
              echo "release refused: ${tag} points to ${target}, expected ${GITHUB_SHA}" >&2
              return 1
            fi
            echo "reusing existing ${tag} at verified commit ${target}"
          }

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            verify_existing_tag
            exit 0
          fi

          tag_object="$(
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
              --raw-field tag="${tag}" \
              --raw-field message="mlx-stump ${VERSION}" \
              --raw-field object="${GITHUB_SHA}" \
              --raw-field type="commit" \
              --jq '.sha'
          )"
          if gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            --raw-field ref="refs/tags/${tag}" \
            --raw-field sha="${tag_object}" >/dev/null; then
            exit 0
          fi

          # A concurrent/manual creator may have won the race. Accept only the
          # same annotated tag at the exact commit whose artifacts we tested.
          git fetch --force --tags --quiet origin
          verify_existing_tag

  publish:
    name: Publish verified distributions
    needs: [prepare_publish, tag]
    if: needs.prepare_publish.outputs.publish_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi-release-v2
    # This job intentionally has no checkout and no executable project code.
    # Its sole privilege is requesting the trusted-publisher OIDC token.
    permissions:
      id-token: write  # authenticate to PyPI's trusted publisher
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-dist
          path: dist-pending/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-pending/
