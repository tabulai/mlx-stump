name: Publish to PyPI

# This filename and environment deliberately differ from every historical
# publisher in this repository. Before the first run, configure PyPI's trusted
# publisher as:
#
#   project: mlx-stump
#   workflow: publish-pypi.yml
#   environment: pypi-release-v2
#
# Revoke the historical release.yml / pypi identity as well. Otherwise a tag
# aimed at an old commit could still run that commit's workflow and obtain an
# OIDC publishing token. Protect pypi-release-v2 with required reviewers and
# restrict v* tag creation with a repository ruleset whose DeployKey actor
# class can bypass it. Keep the dedicated release key as the repository's
# only deploy key, and store its private half as RELEASE_TAG_DEPLOY_KEY on
# pypi-release-v2; this workflow can read it only after environment approval
# and only when dispatched from main.
#
# Run this workflow manually from main after updating __version__, committing,
# and letting CI pass:
#
#   gh workflow run publish-pypi.yml --ref main -f version=0.1.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release; must equal __version__ (e.g. 0.1.0)"
        required: true
        type: string

# Serialize the tag-and-publish transaction. Never cancel a release after its
# tag may have been created.
concurrency:
  group: mlx-stump-pypi-release
  cancel-in-progress: false

permissions:
  actions: read  # query the exact-SHA CI result before release
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: macos-15
    timeout-minutes: 45
    env:
      VERSION: ${{ inputs.version }}
      PYTHONHASHSEED: "0"
      TZ: UTC
      COPYFILE_DISABLE: "1"
    steps:
      - name: Refuse to release from anything but main
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "release refused: run this workflow from main (got ${GITHUB_REF})" >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
          architecture: arm64
      - name: Require successful CI for this exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          query = urllib.parse.urlencode(
              {
                  "head_sha": sha,
                  "event": "push",
                  "status": "success",
                  "per_page": 100,
              }
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs?{query}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              runs = json.load(response).get("workflow_runs", [])
          exact = [
              run
              for run in runs
              if run.get("head_sha") == sha
              and run.get("head_branch") == "main"
              and run.get("event") == "push"
              and run.get("conclusion") == "success"
          ]
          if not exact:
              raise SystemExit(
                  f"release refused: CI has not passed for exact main commit {sha}"
              )
          print(f"verified successful CI run {exact[0]['html_url']} for {sha}")
          PY
      - name: Check that the requested version is the package version
        run: python .github/scripts/check_tag_version.py "v${VERSION}"
      - name: Install the hash-locked build toolchain
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/build-venv"
          "${RUNNER_TEMP}/build-venv/bin/python" -m pip install \
            --require-hashes --only-binary=:all: \
            -r .github/requirements/release-build.txt
          echo "${RUNNER_TEMP}/build-venv/bin" >> "${GITHUB_PATH}"
      - name: Fix reproducible build inputs to the release commit
        shell: bash
        run: |
          set -euo pipefail
          epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          if [[ ! "${epoch}" =~ ^[0-9]+$ ]]; then
            echo "release refused: invalid commit timestamp ${epoch}" >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=${epoch}" >> "${GITHUB_ENV}"
      - run: ruff check src tests bench .github/scripts
      - name: Build twice and require byte-identical distributions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/source-a" "${RUNNER_TEMP}/source-b"
          mkdir -p "${RUNNER_TEMP}/dist-a" "${RUNNER_TEMP}/dist-b"
          git archive "${GITHUB_SHA}" | tar -x -C "${RUNNER_TEMP}/source-a"
          git archive "${GITHUB_SHA}" | tar -x -C "${RUNNER_TEMP}/source-b"
          python -m build --no-isolation --outdir "${RUNNER_TEMP}/dist-a" \
            "${RUNNER_TEMP}/source-a"
          python -m build --no-isolation --outdir "${RUNNER_TEMP}/dist-b" \
            "${RUNNER_TEMP}/source-b"
          python .github/scripts/verify_reproducible_dist.py \
            "${RUNNER_TEMP}/dist-a" "${RUNNER_TEMP}/dist-b" dist
      - run: twine check --strict dist/*
      - name: Test the built wheel in a clean environment
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/wheel-venv"
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install \
            --require-hashes --only-binary=:all: \
            -r .github/requirements/release-test.txt
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pip check
          "${RUNNER_TEMP}/wheel-venv/bin/python" - <<'PY'
          import pathlib
          import sys

          import mlx_stump

          module = pathlib.Path(mlx_stump.__file__).resolve()
          prefix = pathlib.Path(sys.prefix).resolve()
          assert module.is_relative_to(prefix), (module, prefix)
          assert "site-packages" in module.as_posix(), module
          print("testing", module, mlx_stump.__version__)
          PY
          "${RUNNER_TEMP}/wheel-venv/bin/python" -m pytest tests/ -q
      - name: Build, install, and test from the sdist in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          sdist_file="$(find "${GITHUB_WORKSPACE}/dist" -maxdepth 1 -name '*.tar.gz' -print -quit)"
          test -n "${sdist_file}"
          mkdir -p "${RUNNER_TEMP}/sdist"
          tar xzf "${sdist_file}" -C "${RUNNER_TEMP}/sdist"
          python -m venv "${RUNNER_TEMP}/sdist-venv"
          "${RUNNER_TEMP}/sdist-venv/bin/python" -m pip install \
            --require-hashes --only-binary=:all: \
            -r .github/requirements/release-test.txt
          "${RUNNER_TEMP}/sdist-venv/bin/python" -m pip install \
            --no-deps --no-build-isolation "${sdist_file}"
          "${RUNNER_TEMP}/sdist-venv/bin/python" -m pip check
          cd "${RUNNER_TEMP}"/sdist/mlx_stump-*
          "${RUNNER_TEMP}/sdist-venv/bin/python" - <<'PY'
          import pathlib
          import sys

          import mlx_stump

          module = pathlib.Path(mlx_stump.__file__).resolve()
          prefix = pathlib.Path(sys.prefix).resolve()
          assert module.is_relative_to(prefix), (module, prefix)
          assert "site-packages" in module.as_posix(), module
          print("testing sdist installation", module, mlx_stump.__version__)
          PY
          "${RUNNER_TEMP}/sdist-venv/bin/python" -m pytest tests -q -p no:cacheprovider
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
          # A release recovery uses GitHub's "Re-run all jobs" on this same
          # workflow run, so replace the previous immutable v4 artifact.
          overwrite: true

  prepare_publish:
    name: Verify PyPI state
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    env:
      VERSION: ${{ inputs.version }}
    outputs:
      publish_needed: ${{ steps.pypi_state.outputs.publish_needed }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist/
      - name: Check for an exact partial or completed PyPI upload
        id: pypi_state
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import urllib.error
          import urllib.request

          dist = pathlib.Path("dist")
          files = sorted(path for path in dist.iterdir() if path.is_file())
          if not files:
              raise SystemExit("release refused: downloaded artifact contains no distributions")
          local = {
              path.name: hashlib.sha256(path.read_bytes()).hexdigest()
              for path in files
          }

          version = os.environ["VERSION"]
          request = urllib.request.Request(
              f"https://pypi.org/pypi/mlx-stump/{version}/json",
              headers={"Accept": "application/json", "Cache-Control": "no-cache"},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              remote = {}
          else:
              remote = {
                  item["filename"]: item.get("digests", {}).get("sha256")
                  for item in payload.get("urls", [])
              }
              if not remote:
                  raise SystemExit(
                      f"release refused: PyPI has version {version} but reports no files"
                  )

          extra = sorted(remote.keys() - local.keys())
          mismatched = sorted(
              name for name in remote.keys() & local.keys() if remote[name] != local[name]
          )
          if extra or mismatched:
              raise SystemExit(
                  "release refused: PyPI already contains different artifacts for "
                  f"{version} (unexpected={extra}, hash_mismatch={mismatched})"
              )

          pending = pathlib.Path("dist-pending")
          pending.mkdir()
          for name in sorted(local.keys() - remote.keys()):
              shutil.copy2(dist / name, pending / name)

          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              if remote.keys() == local.keys():
                  print("publish_needed=false", file=stream)
                  print("all distributions already exist on PyPI with matching hashes")
              else:
                  print("publish_needed=true", file=stream)
                  if remote:
                      print(
                          "resuming an exact partial upload; existing files: "
                          + ", ".join(sorted(remote))
                      )
          PY
      - if: steps.pypi_state.outputs.publish_needed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pypi-dist
          path: dist-pending/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  tag:
    name: Tag the verified commit
    needs: prepare_publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi-release-v2
    # GITHUB_TOKEN remains read-only. The environment-gated release deploy key
    # is the repository's only member of the ruleset's DeployKey bypass class
    # and can reach this job only after reviewer approval.
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Create or verify the release tag
        shell: bash
        env:
          RELEASE_TAG_DEPLOY_KEY: ${{ secrets.RELEASE_TAG_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          key_file="${RUNNER_TEMP}/release-tag-deploy-key"
          if [[ -z "${RELEASE_TAG_DEPLOY_KEY}" ]]; then
            echo "release refused: RELEASE_TAG_DEPLOY_KEY is not configured" >&2
            exit 1
          fi
          umask 077
          printf '%s\n' "${RELEASE_TAG_DEPLOY_KEY}" > "${key_file}"
          trap 'rm -f "${key_file}"' EXIT
          ssh_command="ssh -i ${key_file} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

          git fetch --force --tags --quiet origin \
            "+refs/heads/main:refs/remotes/origin/main"
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "refs/remotes/origin/main"; then
            echo "release refused: ${GITHUB_SHA} is no longer on origin/main" >&2
            exit 1
          fi

          verify_existing_tag() {
            if [[ "$(git cat-file -t "refs/tags/${tag}")" != "tag" ]]; then
              echo "release refused: ${tag} exists but is not an annotated tag" >&2
              return 1
            fi
            local target
            target="$(git rev-parse "refs/tags/${tag}^{commit}")"
            if [[ "${target}" != "${GITHUB_SHA}" ]]; then
              echo "release refused: ${tag} points to ${target}, expected ${GITHUB_SHA}" >&2
              return 1
            fi
            echo "reusing existing ${tag} at verified commit ${target}"
          }

          verify_remote_tag() {
            # Do not trust an SSH push's exit status as proof that GitHub now
            # holds the tag. Fetch that exact remote ref over independently
            # authenticated HTTPS; an absent ref makes this command fail even
            # if a same-named local tag still exists.
            git fetch --force --quiet \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              "refs/tags/${tag}:refs/tags/${tag}"
            verify_existing_tag
          }

          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            verify_remote_tag
            exit 0
          fi

          git config user.name "mlx-stump release workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${tag}" "${GITHUB_SHA}" --message "mlx-stump ${VERSION}"
          if GIT_SSH_COMMAND="${ssh_command}" git push \
            "git@github.com:${GITHUB_REPOSITORY}.git" "refs/tags/${tag}"; then
            verify_remote_tag
            exit 0
          fi

          # A concurrent/manual creator may have won the race. Accept only the
          # same annotated tag at the exact commit whose artifacts we tested.
          git tag --delete "${tag}"
          verify_remote_tag

  publish:
    name: Publish verified distributions
    needs: [prepare_publish, tag]
    if: needs.prepare_publish.outputs.publish_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi-release-v2
    # This job intentionally has no checkout and no executable project code.
    # Its sole privilege is requesting the trusted-publisher OIDC token.
    permissions:
      id-token: write  # authenticate to PyPI's trusted publisher
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pypi-dist
          path: dist-pending/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist-pending/
